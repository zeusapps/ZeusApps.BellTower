name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  publish:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: release
      - name: Publish validated release bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Expected vMAJOR.MINOR.PATCH.' }
          $version = $env:RELEASE_TAG.Substring(1)
          $package = "release/bell-tower-$version-win-x64.zip"
          $metadata = "release/bell-tower-$version-win-x64.release.json"
          $offer = Get-Content -LiteralPath $metadata -Raw | ConvertFrom-Json
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($offer.contract.version -cne $version -or $offer.archiveHash -cne $hash) { throw 'Validated release metadata/hash mismatch.' }
          $checksum = (Get-Content -LiteralPath "$package.sha256" -Raw).Trim().Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
          if ($checksum[0] -cne $hash -or $checksum[1] -cne [System.IO.Path]::GetFileName($package)) { throw 'Checksum mismatch.' }
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; tags/assets are immutable.' }
          gh release create $env:RELEASE_TAG $package "$package.sha256" $metadata --verify-tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
